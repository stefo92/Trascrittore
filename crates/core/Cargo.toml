[package]
name = "trascrittore-core"
description = "Decodifica audio, trascrizione con whisper.cpp ed esportazione dei documenti"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["whisper"]
# Motore di trascrizione (whisper.cpp). Disattivabile per compilare e testare
# il resto del nucleo senza CMake/libclang.
whisper = ["dep:whisper-rs"]
# Schede video. Vulkan funziona con AMD, NVIDIA e Intel (richiede il Vulkan SDK per compilare);
# CUDA solo con NVIDIA (richiede il CUDA Toolkit); Metal con i Mac Apple Silicon (solo su macOS).
vulkan = ["whisper", "whisper-rs/vulkan"]
cuda = ["whisper", "whisper-rs/cuda"]
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# `raw-api` espone il registro dei dispositivi di ggml, usato per elencare le schede video.
whisper-rs = { version = "0.16", optional = true, features = ["raw-api"] }
symphonia = { version = "0.6", features = ["all"] }
rubato = "5.0"
krilla = "0.8"
ttf-parser = "0.25"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
ureq = "3.4"
directories = "6.0"
chrono = "0.4"
# OpenVINO (Intel) viene caricato solo se presente: nessuna dipendenza in fase di compilazione.
libloading = "0.9"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
