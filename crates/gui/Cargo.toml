[package]
name = "trascrittore-gui"
description = "Interfaccia grafica accessibile di Trascrittore"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "trascrittore"
path = "src/main.rs"

[features]
vulkan = ["trascrittore-core/vulkan"]
cuda = ["trascrittore-core/cuda"]

[dependencies]
trascrittore-core.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.5"
