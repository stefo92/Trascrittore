[package]
name = "trascrittore-gui"
description = "Interfaccia grafica accessibile di Trascrittore"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "trascrittore"
path = "src/main.rs"

[features]
vulkan = ["trascrittore-core/vulkan"]
cuda = ["trascrittore-core/cuda"]
metal = ["trascrittore-core/metal"]

[dependencies]
trascrittore-core.workspace = true
anyhow.workspace = true

# Su macOS l'interfaccia usa i controlli nativi di AppKit, letti da VoiceOver.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# NSSavePanel/NSOpenPanel con i tipi di file (UTType) richiedono la feature dedicata.
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.5"
