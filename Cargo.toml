[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Trascrittore contributors"]
rust-version = "1.85"

[workspace.dependencies]
trascrittore-core = { path = "crates/core" }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# whisper.cpp è molto lento senza ottimizzazioni: ottimizza le dipendenze anche in debug.
[profile.dev.package."*"]
opt-level = 3
